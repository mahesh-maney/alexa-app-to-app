[pytest]
# E2E test configuration
# Run from repo root: pytest tests/e2e/ -v

testpaths = tests/e2e

# Custom marks
markers =
    smoke:       Critical-path tests — no browser, run on every deploy (~30s)
    browser:     Requires Playwright headless browser (slower, ~3-5 min per flow)
    fulfillment: Tests Alexa/GH fulfillment endpoints (requires tokens)
    regression:  Regression tests for previously fixed bugs

# Default: show test ids + short tracebacks
addopts = -v --tb=short

# Treat warnings as errors (optional — comment out if too noisy at first)
# filterwarnings = error
